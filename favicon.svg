<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="11" y="14" width="42" height="38" rx="7"/>
    </clipPath>
  </defs>

  <!-- Fondo corporativo redondeado -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>

  <!-- Anillas superiores -->
  <rect x="19" y="9" width="5" height="9" rx="2.5" fill="#e0f2fe"/>
  <rect x="40" y="9" width="5" height="9" rx="2.5" fill="#e0f2fe"/>

  <!-- Tarjeta calendario blanca -->
  <g clip-path="url(#cardClip)">
    <rect x="11" y="14" width="42" height="38" fill="#ffffff"/>
    <!-- Cabecera roja coral -->
    <rect x="11" y="14" width="42" height="11" fill="#ef4444"/>
  </g>

  <!-- Líneas/franjas del planner (rojo y azul claro) -->
  <rect x="16" y="30" width="14" height="5" rx="2.5" fill="#fecaca"/>
  <rect x="33" y="30" width="14" height="5" rx="2.5" fill="#bae6fd"/>
  <rect x="16" y="39" width="18" height="5" rx="2.5" fill="#e2e8f0"/>

  <!-- Insignia check verde (Tareas) -->
  <circle cx="46.5" cy="46.5" r="11.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M41.5 46.7 L45 50.2 L51.8 42.9" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
